{{- if .Values.rdsCa.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rds-ca
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  us-east-2-bundle.pem: |
    {{- required "files/us-east-2-bundle.pem is required when rdsCa.enabled" (.Files.Get "files/us-east-2-bundle.pem") | nindent 4 }}
{{- end }}
